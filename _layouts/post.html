---
layout: default
---

<div class="post-shell">
  <article class="post">
    <div class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta">
        <span class="post-date">{{ page.date | date: "%Y.%m.%d %H:%M" }}</span>
        <span class="post-category tag-{{ page.color }}">{{ page.category }}</span>
      </div>
    </div>
    <div class="post-content">
      {{ content }}
    </div>
  </article>

  <aside class="post-toc" aria-label="게시글 바로가기">
    <div class="post-toc-title">on this page</div>
    <nav class="post-toc-links"></nav>
  </aside>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const headings = document.querySelectorAll(".post-content h1, .post-content h2");
    const toc = document.querySelector(".post-toc");
    const tocLinks = document.querySelector(".post-toc-links");

    if (!headings.length || !toc || !tocLinks) {
      if (toc) toc.hidden = true;
      return;
    }

    headings.forEach(function (heading, index) {
      const level = Number(heading.tagName.replace("H", ""));

      if (!heading.id) {
        heading.id = "section-" + (index + 1);
      }

      const link = document.createElement("a");
      link.href = "#" + heading.id;
      link.textContent = heading.textContent;
      link.className = "post-toc-link level-" + level;
      tocLinks.appendChild(link);
    });

    const links = tocLinks.querySelectorAll("a");
    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;

        links.forEach(function (link) {
          link.classList.toggle("active", link.getAttribute("href") === "#" + entry.target.id);
        });
      });
    }, { rootMargin: "-20% 0px -70% 0px" });

    headings.forEach(function (heading) {
      observer.observe(heading);
    });
  });
</script>
